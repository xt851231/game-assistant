<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stream Quest</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b6cee",
                        "primary-dark": "#1a4a8d",
                        "accent-gold": "#ffd700",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "rpg-slate": "#232f48",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "pixel": ['"Press Start 2P"', "cursive"],
                    },
                    boxShadow: {
                        "pixel": "4px 4px 0px 0px rgba(0,0,0,0.5)",
                        "pixel-sm": "2px 2px 0px 0px rgba(0,0,0,0.5)",
                    },
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #05080c;
            color: white;
            overflow: hidden;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            background: #0a0f16;
        }
        ::-webkit-scrollbar-track {
            background: #0c1219;
            border-left: 1px solid #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b6cee;
            border-radius: 4px;
            border: 1px solid #0a0f16;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ffd700;
        }
        
        /* RPG Window Style */
        .rpg-window {
            background: linear-gradient(180deg, #2b6cee 0%, #1e3a8a 100%);
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 2px #000000, 4px 4px 0px rgba(0,0,0,0.4);
            position: relative;
        }
        .rpg-window-gold {
            border-color: #ffd700;
        }
        /* Button Press Effect */
        .btn-pixel:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px rgba(0,0,0,0);
        }
        /* Range Slider Customization */
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 0px;
            background: #ffd700;
            border: 2px solid white;
            cursor: pointer;
            margin-top: -6px; 
            box-shadow: 2px 2px 0 #000;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #1e3a8a;
            border: 1px solid #475569;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
